name: Build DarooYar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Android project
        run: |
          base64 -d DarooYar-Android-Source.zip.base64 > source.zip
          unzip -q source.zip -d DarooYar-Android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p DarooYar-Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DarooYar-debug-apk
          path: DarooYar-Android/app/build/outputs/apk/debug/app-debug.apk
